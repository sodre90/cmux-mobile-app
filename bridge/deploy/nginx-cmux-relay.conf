# Home-server vhost for cmux-relay. Terminates mutual TLS for BOTH the Mac agent
# and app devices on your public DNS name, and proxies to the loopback relay.
#
# This `map` must live in the http{} context (not inside server{}):
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }

# A brand-new agent (no cert yet) registers through the separate, no-mTLS
# vhost in nginx-cmux-relay-bootstrap.conf — this vhost's ssl_verify_client on
# stays mandatory for both the agent tunnel and all device traffic.

server {
    listen 443 ssl;
    http2 on;
    server_name cmux.example.com;            # your home-server DNS name

    ssl_certificate     /etc/nginx/certs/cmux/server.crt;
    ssl_certificate_key /etc/nginx/certs/cmux/server.key;

    # Mutual TLS: agent + device certs are signed by this one CA.
    ssl_client_certificate /etc/nginx/certs/cmux/client-ca.crt;
    ssl_verify_client      on;

    client_max_body_size 256k;

    # The relay distinguishes the Mac agent from app devices by client-cert CN.
    # Always SET (never trust an inbound) X-Client-Cert-CN from the verified DN,
    # so a client cannot spoof it; the relay parses the CN= component.
    location / {
        # If nginx is on a DIFFERENT host than the relay, proxy to the relay's
        # LAN address (e.g. http://192.168.1.160:8765) and set edge_token in the
        # relay config + the X-Edge-Token header below, so only nginx can drive
        # the relay. If nginx is local, http://127.0.0.1:8765 with no edge token.
        proxy_pass http://127.0.0.1:8765;

        proxy_http_version 1.1;
        proxy_set_header Upgrade          $http_upgrade;
        proxy_set_header Connection       $connection_upgrade;
        proxy_set_header Host             $host;
        proxy_set_header X-Forwarded-For  $remote_addr;
        proxy_set_header X-Client-Cert-CN $ssl_client_s_dn;   # relay parses CN=…
        # proxy_set_header X-Edge-Token   "CHANGE_ME_edge_secret";  # if edge_token is set

        # The agent tunnel (/agent/tunnel) and terminal/event WebSockets are
        # long-lived.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
