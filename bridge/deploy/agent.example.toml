# cmux-bridge agent config (Mac). Copy to ~/.config/cmux-bridge/agent.toml.
relay_url   = "wss://cmux.example.com/agent/tunnel"
client_cert = "~/.config/cmux-bridge/agent.crt"     # CN=agent:<tenant-id>; written by self-registration (see bootstrap_url below)
client_key  = "~/.config/cmux-bridge/agent.key"
ca_cert     = ""                                    # CA that signed the nginx server cert; leave empty for a public CA (Let's Encrypt)
relay_token = "CHANGE_ME_long_random_secret"        # must match the relay
cmux_bin    = "cmux"
# bootstrap_url = "https://cmux.example.com:8444/tenants/register"  # used once, on first run

# Direct (Tailscale) mode -- optional, additive to the relay above. See
# bridge/README.md#direct-tailscale-mode for the one-time Tailscale setup
# this requires.
# direct_listen     = ":8443"
# direct_auth_store = "~/.config/cmux-bridge/direct-auth.db"
# Direct-mode push. Same Firebase project as the relay's, but set here too
# because the agent keeps its own device store. Empty disables direct push.
# fcm_project_id  = "your-firebase-project-id"
# fcm_credentials = "~/.config/cmux-bridge/fcm-service-account.json"

# Where the agent writes its own log. It rotates this file itself (8MB, 5
# compressed generations, 30 days) because launchd will not. Set it to "" to
# log to stderr instead and leave the file to whoever supervises the process.
# log_file = "~/Library/Logs/cmux-bridge.log"
