# Sample nginx vhost for cmux-bridge on your Home Assistant edge.
# Terminates mutual TLS and reverse-proxies to the Mac running cmux-bridge.
#
# This `map` must live in the http{} context (not inside server{}). It lets the
# same vhost proxy both plain HTTP and WebSocket upgrades.
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }

server {
    listen 443 ssl;
    http2 on;
    server_name cmux.example.com;          # your dedicated DNS name

    # --- Server certificate (edge) ---
    ssl_certificate     /etc/nginx/certs/cmux/server.crt;
    ssl_certificate_key /etc/nginx/certs/cmux/server.key;

    # --- Mutual TLS: require a client certificate signed by your CA ---
    ssl_client_certificate /etc/nginx/certs/cmux/client-ca.crt;
    ssl_verify_client      on;             # reject anyone without a valid client cert

    # Optional: cap body size; the bridge API bodies are tiny.
    client_max_body_size 256k;

    location / {
        # The Mac's LAN address and the bridge's listen port (config.toml).
        proxy_pass http://192.0.2.10:8765;

        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;
        proxy_set_header Host               $host;
        proxy_set_header X-Forwarded-For    $remote_addr;
        proxy_set_header X-Client-Cert-CN   $ssl_client_s_dn;   # for audit logs

        # Terminal/event WebSockets are long-lived.
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
    }
}
