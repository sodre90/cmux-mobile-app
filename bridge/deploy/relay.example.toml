# cmux-relay config (home server). Copy to /etc/cmux-relay/config.toml.
#
# ca_cert/ca_key are set explicitly below (rather than left to default under
# ~/.config/cmux-relay) because deploy/cmux-relay.service runs with
# ProtectSystem=strict + StateDirectory=cmux-relay: only /var/lib/cmux-relay
# is writable, so a ~/.config default would fail to create the CA on first
# run. If you're running cmux-relay outside that unit (no hardening), the
# ~/.config default is fine and these two lines are unnecessary.
listen      = "127.0.0.1:8765"                 # loopback; nginx is the edge
token_store = "/var/lib/cmux-relay/store.db"
relay_token = "CHANGE_ME_long_random_secret"    # shared with the Mac agent
edge_token  = ""                                # if nginx is on another host: a secret it must send in X-Edge-Token (empty = off, for a loopback relay)
ca_cert     = "/var/lib/cmux-relay/ca.crt"      # the relay's own CA, auto-created on first run if absent
ca_key      = "/var/lib/cmux-relay/ca.key"

# Push (optional): leave both empty to disable.
# fcm_project_id  = "your-firebase-project-id"
# fcm_credentials = "/etc/cmux-relay/fcm-service-account.json"

# Secrets and listen address may instead (or additionally) be supplied via
# environment variables, which win over whatever this file sets -- handy for
# a container orchestrator's secret store instead of a checked-in file:
#   CMUX_RELAY_TOKEN, CMUX_RELAY_EDGE_TOKEN, CMUX_RELAY_FCM_CREDENTIALS,
#   CMUX_RELAY_LISTEN
