name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bridge:
    name: bridge
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: bridge/go.mod
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: bridge

  android:
    name: android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # NOTE: testImplementation(lazysodium-java) ships class file version 65
          # (Java 21) for its test-only JVM binding, so the unit test JVM must be
          # 21+ even though app code targets JVM 17 (see app/build.gradle.kts).
          # Verified locally: JDK 17 fails testDebugUnitTest with
          # UnsupportedClassVersionError on com.goterl.lazysodium.LazySodiumJava.
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: assembleDebug + testDebugUnitTest
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest
