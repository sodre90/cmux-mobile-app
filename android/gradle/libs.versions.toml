[versions]
agp = "8.7.0"
kotlin = "2.0.20"
coreKtx = "1.13.1"
lifecycle = "2.8.6"
activityCompose = "1.9.3"
composeBom = "2024.10.01"
navigationCompose = "2.8.3"
okhttp = "4.12.0"
serialization = "1.7.3"
coroutines = "1.8.1"
datastore = "1.1.1"
securityCrypto = "1.1.0-alpha06"
firebaseBom = "33.5.1"
googleServices = "4.4.2"
junit = "4.13.2"
bouncycastle = "1.84"
lazysodium = "5.2.0"
jna = "5.17.0"
cameraX = "1.5.3"
